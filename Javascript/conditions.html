<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditions</title>
</head>
<body>
    <script>

        var n = prompt("Enter number: ");

        let s=0;
        while(n>0){
            let r = r%10;
            s=s+ r*r*r;
            n=n/10;
        }

        if (s==n){
            document.write("Armstrong number");
        }
        else{
            document.write("Not an Armstrong number");
        }

    </script>
</body>
</html>

    <script>
        // function add(a, b){

        // document.write(add(10, 20));


        // ARROW FUNCTION
        var x = prompt("Enter the name of vehicle");

        const car =(name , cost , seat) => "<br>" + (name + cost + seat);
        const aeroplane =(name , cost , seat) => "<br>" + (name + cost + seat);
        const helicopter =(name , cost , seat) => "<br>" + (name + cost + seat);
        if (x=="car"){
            document.write(car("volvo", " 50 lakh", " 5 seater"));
        }
        else if (x=="aeroplane"){
            document.write(aeroplane("boeing", " 500 crore", " 300 seater"));
        }
        else if (x=="helicopter"){
            document.write(helicopter("bell", " 10 crore", " 10 seater"));
        }
        else{
            document.write("Invalid input");
        } 
        
 
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map function</title>
</head>
<body>
    <script>
        const num=[10, 22, 41, 5, 62, 56, 81, 9];
        const even = num.filter((i)=>(i%2==0));
        const square = even.map((i)=>(i*i));
        console.log("Square: ", square);
    </script>
    
</body>
</html>
